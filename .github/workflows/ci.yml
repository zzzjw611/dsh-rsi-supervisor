name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and packaged dashboard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and command-line entrypoint
        run: python -m pip install -e .
      - name: Compile and verify CLI
        run: make lint
      - name: Run durable supervisor and dashboard tests
        run: make test
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/loopgraph-wheel .

  container:
    name: Build portable deployment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag loopgraph-supervisor:ci .
